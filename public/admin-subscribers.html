<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Subscribers | SKYLINE admin</title><link rel="stylesheet" href="/theme.css">
<style>body{padding:28px 20px}.w{max-width:820px;margin:0 auto}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:18px}td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.row .form-control{width:auto;flex:1;min-width:150px}button.button{cursor:pointer;color:var(--text);background:transparent}</style></head>
<body><div class="w"><p class="eyebrow">ADMIN</p><h1 style="font-size:40px;margin:10px 0">Studio subscribers</h1>
<p class="body-copy">Grant or revoke Studio access by email. Use it after you confirm a payment. Admins never need a subscription.</p>
<div class="row"><input class="form-control" id="em" type="email" required placeholder="subscriber@email.com" aria-label="Subscriber email"><select class="form-control" id="dy" aria-label="Access length"><option value="30">30 days</option><option value="90">90 days</option><option value="365">365 days</option><option value="0">No end date</option></select><button class="button button-gold" id="g">Grant</button><button class="button button-outline" id="r">Revoke</button></div>
<p id="msg" class="body-copy" aria-live="polite"></p><table id="t"></table></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(opt){const r=await fetch('/api/admin/subscriptions',{redirect:'manual',cache:'no-store',headers:{'Content-Type':'application/json'},...opt});
 if(r.status===401||r.type==='opaqueredirect'){const j=r.status===401?await r.json().catch(()=>({})):{};location=j.login_url||'https://hatchable.com/console/login';return null;}
 if(r.status===403){$('msg').textContent='Administrator access is required.';return null;}
 const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed. Please retry.');return d;}
async function load(){try{const d=await api();if(!d)return;$('t').innerHTML='<caption>Subscriber access, most recently updated first</caption><thead><tr><th scope="col">Email</th><th scope="col">Status</th><th scope="col">Ends</th><th scope="col">Source</th></tr></thead><tbody>'+d.subscriptions.map(s=>`<tr><td>${esc(s.email)}</td><td>${esc(s.status)}</td><td>${s.period_end?esc(new Date(s.period_end).toLocaleDateString()):'none'}</td><td>${esc(s.source)}</td></tr>`).join('')+'</tbody>';}catch(e){$('msg').textContent=e.message||'Could not load subscribers. Please retry.';}}
let busy=false;
async function act(action){if(busy)return;if(!$('em').reportValidity()||!$('em').value.trim()){$('msg').textContent='Enter a valid subscriber email.';return;}
 busy=true;$('g').disabled=true;$('r').disabled=true;$('msg').textContent='Saving access…';
 try{const d=await api({method:'POST',body:JSON.stringify({email:$('em').value,action,days:$('dy').value})});if(!d)return;$('msg').textContent='Saved: '+d.email+' is '+d.status+'.';await load();}
 catch(e){$('msg').textContent=e.message||'Could not save access. Please retry.';}
 finally{busy=false;$('g').disabled=false;$('r').disabled=false;}}
$('g').onclick=()=>act('grant');$('r').onclick=()=>act('revoke');load();
</script></body></html>
