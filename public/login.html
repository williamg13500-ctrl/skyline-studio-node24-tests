<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="/theme.css"><link rel="icon" href="/favicon.svg"><style>body{padding:32px 20px 80px}main{max-width:900px;margin:auto}.box{padding:24px;border:1px solid var(--line);margin:24px 0;background:var(--surface)}h1{margin:36px 0 20px}h2{font-size:24px;margin:16px 0}p,li{line-height:1.8}li{margin:10px 0}label{display:block;margin:18px 0}button{cursor:pointer;min-height:44px}.bar{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}[hidden]{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere}a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}</style><title>Sign in | Skyline</title></head><body><main style="max-width:460px"><a class="brand" href="/">SKYLINE · STUDIO</a><h1 id="title">Your private workspace</h1><p id="sub">Sign in with a passkey or an emailed one-time code.</p><form class="box" id="login-form"><div id="email-row"><label for="email">Email</label><input class="form-control" id="email" type="email" autocomplete="username webauthn" required></div><div id="code-row" hidden><label for="code">Verification code</label><input class="form-control" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></div><div class="bar"><button class="button button-gold" id="submit">Continue</button><button class="button button-outline" id="back" type="button" hidden>Use another email</button></div></form><section class="box" id="passkey" hidden><h2>Make next time easier</h2><p>Add a passkey to sign in with your fingerprint, face or device lock.</p><div class="bar"><button class="button button-gold" id="passkey-add">Add a passkey</button><button class="button button-outline" id="passkey-skip">Not now</button></div></section><p id="login-message" role="status" aria-live="polite"></p><p><a href="/studio.html">Back to Studio</a></p></main><script src="/login.js"></script></body></html>
