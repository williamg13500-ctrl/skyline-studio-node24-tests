name: Skyline Node 24 verification

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Unpack Skyline source
        shell: bash
        run: |
          SOURCE_ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$SOURCE_ZIP" ]; then
            echo "::error::Skyline source ZIP not found in repository root."
            exit 1
          fi
          mkdir -p source
          unzip -q "$SOURCE_ZIP" -d source

      - name: Run complete test suite
        shell: bash
        run: |
          TEST_RUNNER="$(find source -type f -path '*/lib/verification/run-tests.py' -print -quit)"
          if [ -z "$TEST_RUNNER" ]; then
            echo "::error::Could not find lib/verification/run-tests.py in source ZIP."
            exit 1
          fi

          PROJECT_ROOT="${TEST_RUNNER%/lib/verification/run-tests.py}"
          cd "$PROJECT_ROOT"

          echo "Node version:"
          node --version

          echo "Running complete Skyline test suite:"
          python3 lib/verification/run-tests.py
