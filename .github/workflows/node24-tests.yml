name: Skyline Node 24 verification

on:
  workflow_dispatch:
  push:
    branches:
      - 'snapshot/**'
    paths:
      - 'api/**'
      - 'lib/**'
      - 'migrations/**'
      - 'public/**'
      - 'hatchable.toml'
      - 'README.md'
      - 'tests/**'
      - 'playwright.config.js'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run complete Skyline test suite
        id: tests
        shell: bash
        continue-on-error: true
        run: |
          echo "Node version:"
          node --version
          python3 --version
          echo "Running the complete source-controlled Skyline suite:"
          set +e
          python3 lib/verification/run-tests.py 2>&1 | tee /tmp/skyline-node-tests.tap
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/skyline-node-tests.exit
          exit "$status"

      - name: Run Site Intelligence browser E2E
        id: browser
        shell: bash
        continue-on-error: true
        run: |
          set +e
          npm install --no-save --no-package-lock @playwright/test@1.55.0 &&
            npx playwright install --with-deps chromium &&
            npx playwright test 2>&1 | tee /tmp/skyline-browser-e2e.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/skyline-browser-e2e.exit
          exit "$status"

      - name: Write and publish machine-readable verification result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RESULT_BRANCH="ci-results/${GITHUB_REF_NAME}"
          export RESULT_BRANCH

          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          tap_path = Path("/tmp/skyline-node-tests.tap")
          tap = tap_path.read_text(errors="replace") if tap_path.exists() else ""
          def metric(name):
              match = re.search(r"^# " + re.escape(name) + r" (\d+)\\s*$", tap, re.M)
              return int(match.group(1)) if match else 0

          failures = []
          lines = tap.splitlines()
          i = 0
          while i < len(lines):
              match = re.match(r"^not ok \d+ - (.+)$", lines[i])
              if not match:
                  i += 1
                  continue
              name = match.group(1).strip()
              i += 1
              detail = []
              while i < len(lines) and not re.match(r"^(?:ok|not ok) \d+ - |^# (?:tests|pass|fail|skipped) ", lines[i]):
                  if lines[i].strip() not in ("---", "..."):
                      detail.append(lines[i].strip())
                  i += 1
              failures.append({"name": name, "error": "\n".join(x for x in detail if x) or "No TAP diagnostic text was emitted."})

          test_exit = Path("/tmp/skyline-node-tests.exit")
          if not tap.strip():
              failures.append({"name": "test-runner", "error": "The test runner produced no TAP output; inspect the workflow log."})
          browser_exit = Path("/tmp/skyline-browser-e2e.exit")
          browser_code = browser_exit.read_text().strip() if browser_exit.exists() else None
          browser_result = "passed" if browser_code == "0" else ("failed" if browser_code is not None else "not_run")
          node_version = subprocess.check_output(["node", "--version"], text=True).strip()
          result = {
              "node_version": node_version,
              "commit_hash": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "total_tests": metric("tests"),
              "pass": metric("pass"),
              "fail": metric("fail"),
              "skipped": metric("skipped"),
              "failing_tests": failures,
              "browser_e2e_result": browser_result,
              "run_url": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          }
          Path("/tmp/latest-result.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PY

          # Publish only verification/latest-result.json to the dedicated results branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin "refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"; then
            git switch -C "$RESULT_BRANCH" "origin/$RESULT_BRANCH"
          else
            git switch --orphan "$RESULT_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
          fi
          mkdir -p verification
          cp /tmp/latest-result.json verification/latest-result.json
          git add verification/latest-result.json
          git commit -m "Record Node 24 verification for ${GITHUB_REF_NAME}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/$RESULT_BRANCH"
