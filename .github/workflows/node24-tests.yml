name: Skyline V66 Node 24 verification
# Re-run baseline after recovering the exact V66 studio.js asset

on:
  workflow_dispatch:
  push:
    branches:
      - 'scratch/**'
      - 'snapshot/**'
      - 'release-candidate/v66-six-files'
    paths:
      - 'api/**'
      - 'lib/**'
      - 'migrations/**'
      - 'public/**'
      - 'hatchable.toml'
      - 'README.md'
      - 'tests/**'
      - 'playwright.config.js'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:

  v66-hash-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate repository for result publishing
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Checkout pinned V66 manifest
        uses: actions/checkout@v4
        with:
          ref: fix/v66-test-failures
          path: audit-manifest
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate-source
      - name: Compute and enforce 78-path SHA-256 comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path("audit-manifest/verification/v66-manifest.json").read_text())
          files = manifest["files"]
          if len(files) != 78:
              raise SystemExit(f"Expected 78 manifest entries, got {len(files)}")

          pinned = {
              "lib/access.js": "893a4e07e6339f62ef9df255fb5d6361f42f3217e754a88356e0fb0c7650cefe",
              "lib/engine.js": "20d56dd67899bc183b41d62653592fa1261896c06844d2610a1cf655981b2d74",
              "lib/validation.js": "fd991100b248d12fa40214f96f90a2002075ca7aa54f2b9c5eded973ee872daf",
              "lib/quality-validation.js": "070d9b89991e56b88eec8d2d3e66037aa43017b6fbdc6b3e3a358fc06d811503",
              "lib/editor.js": "966004df152165fde7579e4414e22c8ce0e4abcae65d8cf3277a82fd03abb188",
              "lib/http-errors.js": "606a703213ce759be12fde1fd6bdcd8b182481adbf4e97adb606ae86dbaf61ab",
          }

          rows = []
          missing = []
          for entry in files:
              path = entry["path"]
              expected = entry["sha256"]
              source = Path("candidate-source") / path
              if not source.is_file():
                  actual = ""
                  match = "missing"
                  missing.append(path)
              else:
                  actual = hashlib.sha256(source.read_bytes()).hexdigest()
                  match = "true" if actual == expected else "false"
              rows.append((path, expected, actual, match))

          matches = [r for r in rows if r[3] == "true"]
          differences = [r for r in rows if r[3] == "false"]
          difference_paths = {r[0] for r in differences}
          failures = []
          if missing:
              failures.append("missing manifest paths: " + ", ".join(missing))
          if len(matches) != 72:
              failures.append(f"expected 72 matches, found {len(matches)}")
          if len(differences) != 6:
              failures.append(f"expected 6 differences, found {len(differences)}")
          if difference_paths != set(pinned):
              failures.append("difference paths do not equal the six pinned paths")
          for path, expected_hash in pinned.items():
              actual = next((r[2] for r in rows if r[0] == path), None)
              if actual != expected_hash:
                  failures.append(f"pinned hash mismatch for {path}: {actual}")

          out = Path.home() / "candidate-comparison.csv"
          with out.open("w", newline="") as handle:
              writer = csv.writer(handle)
              writer.writerow(["path", "manifest sha256", "computed sha256", "match"])
              writer.writerows(rows)

          print(f"Manifest paths: {len(rows)}")
          print(f"Matches: {len(matches)}")
          print(f"Differences: {len(differences)}")
          print(f"Missing: {len(missing)}")
          print(f"CSV: {out}")
          if failures:
              print("AUDIT FAILED:")
              for item in failures:
                  print(" - " + item)
              raise SystemExit(1)
          print("AUDIT PASSED: exactly the six pinned candidate files differ.")
          PY
          cp "$HOME/candidate-comparison.csv" "$RUNNER_TEMP/v66-six-file-candidate-comparison.csv"
      - name: Publish candidate hash CSV
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          result_branch="ci-results/v66-six-file-hash-audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin "refs/heads/$result_branch:refs/remotes/origin/$result_branch"; then
            git switch -C "$result_branch" "origin/$result_branch"
          else
            git switch --orphan "$result_branch"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
          fi
          mkdir -p verification
          cp "$RUNNER_TEMP/v66-six-file-candidate-comparison.csv" verification/v66-six-file-candidate-comparison.csv
          printf '%s\n' "${GITHUB_SHA}" > verification/audited-candidate-commit.txt
          git add verification/v66-six-file-candidate-comparison.csv verification/audited-candidate-commit.txt
          git commit -m "Record V66 six-file candidate hash audit"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$result_branch"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate source commit
        uses: actions/checkout@v4
        with:
          ref: 45f455eae21f34d6d756e841137204bf0e71777e
      - name: Checkout pinned repair test bundle
        uses: actions/checkout@v4
        with:
          repository: williamg13500-ctrl/skyline-studio-node24-tests
          ref: e8c4862242e3ece82e3b376ae08f73995e20b656
          path: repair-test-bundle
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify and install pinned repair test bundle
        shell: bash
        run: |
          set -euo pipefail
          candidate_commit=$(git rev-parse HEAD)
          repair_commit=$(git -C repair-test-bundle rev-parse HEAD)
          repair_blob=$(git -C repair-test-bundle rev-parse HEAD:lib/verification/source-tests.json)
          test "$candidate_commit" = "45f455eae21f34d6d756e841137204bf0e71777e"
          test "$repair_commit" = "e8c4862242e3ece82e3b376ae08f73995e20b656"
          test "$repair_blob" = "dc99f15b5cf526e339878be7ab9c872675e43e1d"
          cp repair-test-bundle/lib/verification/source-tests.json lib/verification/source-tests.json
          echo "Candidate source commit: $candidate_commit"
          echo "Repair bundle commit: $repair_commit"
          echo "Repair source-tests blob: $repair_blob"
      - name: Run complete Skyline suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --version
          python3 --version
          python3 lib/verification/run-tests.py > /tmp/skyline-tests.log 2>&1
          code=$?
          cat /tmp/skyline-tests.log
          echo "$code" > /tmp/skyline-tests.exit
          exit 0
      - name: Run browser E2E when its source is present
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [ ! -f playwright.config.js ] || [ ! -d tests/e2e ]; then
            echo "Browser E2E not run: playwright.config.js or tests/e2e is missing from this source snapshot."
            echo "not_run_missing_files" > /tmp/skyline-browser.status
            exit 0
          fi
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          code=$?
          if [ "$code" -eq 0 ]; then npx playwright install --with-deps chromium; code=$?; fi
          if [ "$code" -eq 0 ]; then npx playwright test > /tmp/skyline-browser.log 2>&1; code=$?; cat /tmp/skyline-browser.log; fi
          echo "$code" > /tmp/skyline-browser.exit
          if [ "$code" -eq 0 ]; then echo passed > /tmp/skyline-browser.status; else echo failed > /tmp/skyline-browser.status; fi
          exit 0
      - name: Write result JSON and publish to ci-results branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          required = [
              "public/studio.html", "public/studio.js", "lib/validation.js",
              "README.md", "lib/verification/source-tests.json",
              "lib/site-intelligence.js", "lib/site-fit.js",
              "lib/verification/multistorey-release-gates.md"
          ]
          missing = [p for p in required if not Path(p).is_file()]
          log_path = Path("/tmp/skyline-tests.log")
          raw_log = log_path.read_text(errors="replace") if log_path.exists() else ""
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          def clean(line):
              line = ansi.sub("", line)
              return re.sub(r"^\d{4}-\d{2}-\d{2}T[^ ]+Z\s*", "", line).strip()

          lines = [clean(x) for x in raw_log.splitlines()]
          pre_summary = lines[:next((i for i,x in enumerate(lines) if "failing tests:" in x), len(lines))]
          passed_names, failed_names, skipped_names = [], [], []
          spec = re.compile(r"^([✔✖﹣])\s*(?:RECONSTRUCTED\s*[—-]\s*)?(.+?)(?:\s+\([0-9.]+ms\))?$")
          for line in pre_summary:
              m = spec.match(line)
              if m:
                  mark, name = m.groups()
                  if mark == "✔": passed_names.append(name)
                  elif mark == "✖": failed_names.append(name)
                  elif mark == "﹣": skipped_names.append(name)
                  continue
              m = re.match(r"^(ok|not ok)\s+\d+\s+-\s+(.+?)(?:\s+#\s*SKIP.*)?$", line)
              if m:
                  if "# SKIP" in line: skipped_names.append(m.group(2))
                  elif m.group(1) == "ok": passed_names.append(m.group(2))
                  else: failed_names.append(m.group(2))

          counts = {
              "total": len(passed_names) + len(failed_names) + len(skipped_names),
              "passed": len(passed_names),
              "failed": len(failed_names),
              "skipped": len(skipped_names)
          }
          # Prefer explicit Node TAP/spec summaries when present, but never let a
          # missing or malformed summary erase counts parsed from individual tests.
          for key, patterns in {
              "total": [r"^ℹ\s*tests\s+(\d+)$", r"^# tests (\d+)$"],
              "passed": [r"^ℹ\s*pass\s+(\d+)$", r"^# pass (\d+)$"],
              "failed": [r"^ℹ\s*fail\s+(\d+)$", r"^# fail (\d+)$"],
              "skipped": [r"^ℹ\s*skipped\s+(\d+)$", r"^# skipped (\d+)$"]
          }.items():
              for pattern in patterns:
                  m = next((re.match(pattern,x) for x in lines if re.match(pattern,x)), None)
                  if m:
                      counts[key] = int(m.group(1)); break
          if counts["total"] == 0:
              counts["total"] = counts["passed"] + counts["failed"] + counts["skipped"]

          failure_details = {}
          failure_section = False
          current_name = None
          current_lines = []
          for line in lines:
              if "failing tests:" in line:
                  failure_section = True
                  continue
              if not failure_section:
                  continue
              header = re.match(r"^✖\s*(?:RECONSTRUCTED\s*[—-]\s*)?(.+?)(?:\s+\([0-9.]+ms\))?$", line)
              if header:
                  if current_name:
                      failure_details[current_name] = "\n".join(current_lines).strip()
                  current_name = header.group(1).strip()
                  current_lines = []
              elif current_name and not line.startswith("test at "):
                  current_lines.append(line)
          if current_name:
              failure_details[current_name] = "\n".join(current_lines).strip()

          failures = []
          for name in failed_names:
              detail = failure_details.get(name, "")
              if not detail:
                  detail = "Failure was identified in the runner output; no matching detailed error block was emitted."
              if re.search(r"FileNotFoundError|No such file|ENOENT|cannot find module", detail, re.I):
                  classification = "missing_file"
              elif (
                  ("admin AI provider" in name and "does not provide an export named" in detail)
                  or ("room edits preserve explicit open connections" in name and "1.5 m" in detail)
                  or ("missing optional opening arrays" in name and "Check the project brief" in detail)
                  or ("recorded constraints are explicitly not applied" in name)
                  or ("adjacent boundary backtracking" in name and "validation function" in detail)
              ):
                  classification = "outdated_test"
              else:
                  classification = "code_bug"
              failures.append({"name": name, "error": detail[-8000:], "classification": classification})

          if missing:
              failures.append({
                  "name": "V66 source snapshot incomplete",
                  "error": "Missing required source files: " + ", ".join(missing),
                  "classification": "missing_file"
              })
          if not raw_log.strip():
              failures.append({"name":"test-runner","error":"No test log was produced.","classification":"missing_file"})

          exit_path = Path("/tmp/skyline-tests.exit")
          try:
              test_exit_code = int(exit_path.read_text().strip()) if exit_path.exists() else None
          except ValueError:
              test_exit_code = None
          if counts["total"] == 0 or test_exit_code is None:
              test_status = "error"
          elif counts["failed"] > 0 or missing or test_exit_code != 0:
              test_status = "failed"
              if test_exit_code != 0 and counts["failed"] == 0:
                  failures.append({"name":"test-runner-exit","error":f"Runner exited {test_exit_code}, but no individual failing test was parsed. Treating this as a failed verification, not a pass.","classification":"code_bug"})
          else:
              test_status = "passed"

          browser_status = Path("/tmp/skyline-browser.status").read_text().strip() if Path("/tmp/skyline-browser.status").exists() else "not_run"
          browser_log = Path("/tmp/skyline-browser.log").read_text(errors="replace") if Path("/tmp/skyline-browser.log").exists() else ""
          result = {
              "node_version": subprocess.check_output(["node","--version"], text=True).strip(),
              "python_version": subprocess.check_output(["python3","--version"], text=True).strip(),
              "commit_hash": "45f455eae21f34d6d756e841137204bf0e71777e",
              "workflow_commit": os.environ["GITHUB_SHA"],
              "branch": os.environ.get("GITHUB_HEAD_REF") or os.environ["GITHUB_REF_NAME"],
              "test_bundle_commit": "e8c4862242e3ece82e3b376ae08f73995e20b656",
              "test_bundle_blob": "dc99f15b5cf526e339878be7ab9c872675e43e1d",
              "test_status": test_status,
              "test_exit_code": test_exit_code,
              "test_counts": counts,
              "failing_tests": failures,
              "missing_v66_manifest_files": missing,
              "browser_e2e_result": browser_status,
              "browser_e2e_error": browser_log[-16000:] if browser_status == "failed" else None,
              "run_url": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          }
          Path("/tmp/latest-result.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PY
          git checkout -- lib/verification/source-tests.json
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          RESULT_BRANCH="ci-results/${BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin "refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"; then
            git switch -C "$RESULT_BRANCH" "origin/$RESULT_BRANCH"
          else
            git switch --orphan "$RESULT_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
          fi
          mkdir -p verification
          cp /tmp/latest-result.json verification/latest-result.json
          git add verification/latest-result.json
          git commit -m "Record Node 24 verification for $BRANCH"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$RESULT_BRANCH"

  archive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audited candidate commit
        uses: actions/checkout@v4
        with:
          ref: 45f455eae21f34d6d756e841137204bf0e71777e
      - name: Checkout V66 manifest
        uses: actions/checkout@v4
        with:
          repository: williamg13500-ctrl/skyline-studio-node24-tests
          ref: fix/v66-test-failures
          path: audit-manifest
      - name: Download and hash GitHub source archive without uploading it
        shell: bash
        env:
          SOURCE_COMMIT: 45f455eae21f34d6d756e841137204bf0e71777e
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/skyline-v66-candidate-$SOURCE_COMMIT.zip"
          url="https://codeload.github.com/$GITHUB_REPOSITORY/zip/$SOURCE_COMMIT"
          curl --location --fail --silent --show-error --retry 3 "$url" --output "$archive"
          python3 - "$archive" "$SOURCE_COMMIT" <<'PY'
          import hashlib, json, subprocess, sys, zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          commit = sys.argv[2]
          manifest = json.loads(Path("audit-manifest/verification/v66-manifest.json").read_text())
          manifest_paths = {item["path"] for item in manifest["files"]}
          tree_paths = set(subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", commit], text=True
          ).splitlines())
          with zipfile.ZipFile(archive) as zf:
              zip_paths = [name for name in zf.namelist() if not name.endswith("/")]
          if not zip_paths:
              raise SystemExit("GitHub ZIP contains no files")
          roots = {name.split("/", 1)[0] for name in zip_paths}
          if len(roots) != 1:
              raise SystemExit(f"Expected one archive root folder; found {sorted(roots)}")
          relative_paths = {name.split("/", 1)[1] for name in zip_paths}
          missing_from_zip = sorted(tree_paths - relative_paths)
          unexpected_in_zip = sorted(relative_paths - tree_paths)
          missing_manifest = sorted(manifest_paths - relative_paths)
          extras = sorted(relative_paths - manifest_paths)
          expected_extras = sorted([
              ".github/workflows/node24-tests.yml",
              "playwright.config.js",
              "tests/e2e/site-intelligence.spec.js"
          ])
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          report = {
              "source_commit": commit,
              "archive_url": f"https://github.com/{__import__('os').environ['GITHUB_REPOSITORY']}/archive/{commit}.zip",
              "sha256": sha,
              "zip_file_count": len(zip_paths),
              "git_tree_file_count": len(tree_paths),
              "manifest_path_count": len(manifest_paths),
              "missing_manifest_paths": missing_manifest,
              "missing_git_tree_files": missing_from_zip,
              "unexpected_zip_files": unexpected_in_zip,
              "extra_files": extras,
              "expected_extra_files": expected_extras
          }
          print(json.dumps(report, indent=2))
          if (
              len(manifest_paths) != 78
              or len(zip_paths) != 81
              or len(tree_paths) != 81
              or missing_manifest
              or missing_from_zip
              or unexpected_in_zip
              or extras != expected_extras
          ):
              raise SystemExit("Archive audit failed: GitHub ZIP does not match the 78+3 source tree")
          print("ARCHIVE AUDIT PASSED: 78 manifest paths plus the three known extra files.")
          print("The ZIP was temporary on the runner and was not uploaded as an artifact.")
          PY
